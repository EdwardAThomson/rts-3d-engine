name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler, clippy, rustfmt and the WebAssembly target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The renderer's tests draw offscreen on Mesa's software GPU; the viewer's smoke run needs a virtual display.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-x11-0 xvfb
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p sim3d -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown -p sim3d
      - name: The viewer opens a window and draws
        run: xvfb-run -a cargo run --release -p render3d --bin play3d -- --frames 60 --speed 8
