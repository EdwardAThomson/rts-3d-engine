<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D RTS viewer</title>
<!--
  The viewer (crates/render3d/src/bin/play3d.rs) in the browser, drawing with WebGPU, or WebGL2 where the browser
  has no WebGPU. Build it, serve the repository root and open /web/play3d/ (see docs/render.md):

    cargo build --release --target wasm32-unknown-unknown -p render3d --bin play3d
    wasm-bindgen --target web --no-typescript --out-dir web/play3d/pkg target/wasm32-unknown-unknown/release/play3d.wasm
    python3 -m http.server 8000

  Options go in the address, as the desktop's go on the command line: ?seed=3&players=4&speed=8
-->
<style>
  html, body { margin: 0; height: 100%; background: #14181f; overflow: hidden; }
  #game { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: fixed; left: 8px; bottom: 6px; margin: 0; color: #9a9a9a; font: 12px monospace;
            white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<pre id="status">loading</pre>
<script type="module">
  import init from "./pkg/play3d.js";
  try {
    await init();
  } catch (e) {
    // winit hands control back to the browser by throwing; that one is expected.
    if (!String(e).includes("Using exceptions for control flow")) {
      document.getElementById("status").textContent = `could not start: ${e}`;
      throw e;
    }
  }
  document.getElementById("game").focus();
</script>
</body>
</html>
